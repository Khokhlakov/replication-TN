[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topnet"
version = "0.1.0"
description = "Pure Python reimplementation of TopNetTree training and evaluation."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn>=1.3",
    "joblib",
    "pyyaml",
    "pyarrow",
    "torch",
]

[project.optional-dependencies]
test = ["pytest"]
equiv = ["tensorflow-cpu"]
h12 = ["gudhi"]
boost = ["xgboost"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
